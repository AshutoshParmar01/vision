<!-- HTML Structure -->

<html>

<head>
    <style>
        /* CSS Styling */
        .hero-section {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 20px;
            overflow: hidden;
        }

        .photo-floating-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            /* Creates clean spacing between photos */
            margin-top: 48px;
            width: 100%;
            max-width: 1200px;
        }

        .photo-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            /* Initial soft shadow */
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }

        /* The Hovering Effect */
        .photo-card:hover {
            transform: translateY(-12px) scale(1.02);
            /* Lifts up and expands slightly */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.16);
            /* Deepens shadow to mimic height */
        }

        .photo-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            /* Prevents image distortion */
            display: block;
        }
    </style>
</head>

<body>
